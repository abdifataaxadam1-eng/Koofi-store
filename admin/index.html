<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Koofi Store Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🛍️ Koofi Store Admin</h1>
</header>

<div class="container">

  <div class="card">

    <h2>➕ Add New Product</h2>

    <label>Product Name</label>
    <input type="text" id="name" placeholder="Example: Magnetic Car Phone Charger">

    <label>Product Image URL</label>
    <input type="text" id="image" placeholder="Paste product image link">

    <label>Product Price</label>
    <input type="text" id="price" placeholder="Example: $19.99">

    <label>Category</label>
    <select id="category">
      <option value="Electronics">Electronics</option>
      <option value="Phones">Phones</option>
      <option value="Car Accessories">Car Accessories</option>
      <option value="Home">Home</option>
      <option value="Fashion">Fashion</option>
      <option value="Other">Other</option>
    </select>

    <label>AliExpress Affiliate Link</label>
    <input type="text" id="link" placeholder="Paste your AliExpress affiliate link">

    <label>Product Description</label>
    <textarea id="description" placeholder="Write a short product description"></textarea>

    <button onclick="saveProduct()">Save Product</button>

    <a class="back" href="../index.html">
      ← Back to Koofi Store
    </a>

  </div>

</div>

<script>
function saveProduct() {

  const product = {
    name: document.getElementById("name").value,
    image: document.getElementById("image").value,
    price: document.getElementById("price").value,
    category: document.getElementById("category").value,
    link: document.getElementById("link").value,
    description: document.getElementById("description").value
  };

  if (!product.name || !product.image || !product.link) {
    alert("Please fill Product Name, Image URL and Affiliate Link.");
    return;
  }

  let products = JSON.parse(localStorage.getItem("koofiProducts")) || [];

  products.push(product);

  localStorage.setItem("koofiProducts", JSON.stringify(products));

  alert("✅ Product saved successfully!");

  document.getElementById("name").value = "";
  document.getElementById("image").value = "";
  document.getElementById("price").value = "";
  document.getElementById("link").value = "";
  document.getElementById("description").value = "";
}
</script>

</body>
</html>
