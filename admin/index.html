<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koofi Store | Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:18px;
}

header h1{
  font-size:24px;
}

.container{
  width:92%;
  max-width:1100px;
  margin:25px auto;
}

.admin-box{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  margin-bottom:25px;
}

.admin-box h2{
  margin-bottom:18px;
}

input,textarea{
  width:100%;
  padding:12px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  padding:11px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.add-btn{
  background:#2563eb;
  color:white;
}

.cancel-btn{
  background:#6b7280;
  color:white;
  margin-left:5px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.product{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.product-content{
  padding:15px;
}

.product h3{
  margin-bottom:8px;
}

.price{
  color:#2563eb;
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

.actions{
  display:flex;
  gap:8px;
}

.edit{
  background:#f59e0b;
  color:white;
  flex:1;
}

.delete{
  background:#dc2626;
  color:white;
  flex:1;
}

#message{
  margin-top:10px;
  font-weight:bold;
}

@media(max-width:600px){
  .container{
    width:95%;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <h1>🛍️ Koofi Store Admin</h1>
    <p>Manage your products</p>
  </div>
</header>

<main class="container">

<div class="admin-box">
  <h2 id="formTitle">➕ Add Product</h2>

  <input id="name" type="text" placeholder="Product name">

  <textarea id="description"
    placeholder="Product description"></textarea>

  <input id="price"
    type="text"
    placeholder="Price e.g. $29.99">

  <input id="image"
    type="url"
    placeholder="Product image URL">

  <input id="link"
    type="url"
    placeholder="Affiliate product link">

  <button class="add-btn" onclick="saveProduct()" id="saveBtn">
    Add Product
  </button>

  <button class="cancel-btn"
    onclick="cancelEdit()"
    id="cancelBtn"
    style="display:none">
    Cancel
  </button>

  <div id="message"></div>
</div>


<div class="admin-box">
  <h2>📦 Products</h2>

  <input
    type="text"
    id="search"
    placeholder="Search products..."
    oninput="displayProducts()">

  <div class="products" id="products"></div>
</div>

</main>


<script>

let products = JSON.parse(localStorage.getItem("koofiProducts")) || [];

let editIndex = -1;


function saveProducts(){
  localStorage.setItem(
    "koofiProducts",
    JSON.stringify(products)
  );
}


function saveProduct(){

  const name =
    document.getElementById("name").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const image =
    document.getElementById("image").value.trim();

  const link =
    document.getElementById("link").value.trim();


  if(!name || !price || !image || !link){

    showMessage(
      "❌ Please fill in all required fields.",
      "red"
    );

    return;
  }


  const product = {
    name:name,
    description:description,
    price:price,
    image:image,
    link:link
  };


  if(editIndex === -1){

    products.push(product);

    showMessage(
      "✅ Product added successfully!",
      "green"
    );

  }else{

    products[editIndex] = product;

    editIndex = -1;

    document.getElementById("formTitle").innerText =
      "➕ Add Product";

    document.getElementById("saveBtn").innerText =
      "Add Product";

    document.getElementById("cancelBtn").style.display =
      "none";

    showMessage(
      "✅ Product updated successfully!",
      "green"
    );
  }


  saveProducts();

  clearForm();

  displayProducts();
}


function displayProducts(){

  const container =
    document.getElementById("products");

  const search =
    document.getElementById("search").value.toLowerCase();


  container.innerHTML = "";


  const filtered =
    products.filter(product =>
      product.name.toLowerCase().includes(search)
    );


  if(filtered.length === 0){

    container.innerHTML =
      "<p>No products found.</p>";

    return;
  }


  filtered.forEach((product) => {

    const originalIndex =
      products.indexOf(product);


    container.innerHTML += `

      <div class="product">

        <img
          src="${product.image}"
          alt="${product.name}"
          onerror="this.src='https://via.placeholder.com/500x300?text=No+Image'"
        >

        <div class="product-content">

          <h3>${product.name}</h3>

          <p>${product.description}</p>

          <div class="price">
            ${product.price}
          </div>

          <div class="actions">

            <button
              class="edit"
              onclick="editProduct(${originalIndex})">
              ✏️ Edit
            </button>

            <button
              class="delete"
              onclick="deleteProduct(${originalIndex})">
              🗑️ Delete
            </button>

          </div>

        </div>

      </div>

    `;
  });
}


function editProduct(index){

  const product = products[index];

  document.getElementById("name").value =
    product.name;

  document.getElementById("description").value =
    product.description;

  document.getElementById("price").value =
    product.price;

  document.getElementById("image").value =
    product.image;

  document.getElementById("link").value =
    product.link;


  editIndex = index;


  document.getElementById("formTitle").innerText =
    "✏️ Edit Product";

  document.getElementById("saveBtn").innerText =
    "Update Product";

  document.getElementById("cancelBtn").style.display =
    "inline-block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


function deleteProduct(index){

  if(!confirm("Delete this product?")){
    return;
  }

  products.splice(index,1);

  saveProducts();

  displayProducts();

  showMessage(
    "🗑️ Product deleted.",
    "green"
  );
}


function cancelEdit(){

  editIndex = -1;

  clearForm();

  document.getElementById("formTitle").innerText =
    "➕ Add Product";

  document.getElementById("saveBtn").innerText =
    "Add Product";

  document.getElementById("cancelBtn").style.display =
    "none";
}


function clearForm(){

  document.getElementById("name").value = "";

  document.getElementById("description").value = "";

  document.getElementById("price").value = "";

  document.getElementById("image").value = "";

  document.getElementById("link").value = "";
}


function showMessage(text,color){

  const message =
    document.getElementById("message");

  message.innerText = text;

  message.style.color = color;


  setTimeout(() => {
    message.innerText = "";
  },3000);
}


displayProducts();

</script>

</body>
</html>
